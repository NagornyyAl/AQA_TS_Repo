name: Playwright Tests (lesson21)

on:
  push:
    paths:
      - 'lesson21/**'
      - '.github/workflows/playwright-lesson21.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lesson21/**'
      - '.github/workflows/playwright-lesson21.yml'
  workflow_dispatch:

env:
  WORKING_DIR: ./lesson21

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.WORKING_DIR }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: ${{ env.WORKING_DIR }}

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: ${{ env.WORKING_DIR }}

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-lesson21
          path: ${{ env.WORKING_DIR }}/playwright-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test traces/screenshots on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-lesson21
          path: ${{ env.WORKING_DIR }}/test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npm run allure:generate
        working-directory: ${{ env.WORKING_DIR }}

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-lesson21
          path: ${{ env.WORKING_DIR }}/allure-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Mochawesome report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report-lesson21
          path: ${{ env.WORKING_DIR }}/mochawesome-report
          retention-days: 14
          if-no-files-found: ignore
