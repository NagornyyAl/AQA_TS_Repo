name: Playwright Tests (FinalProject)

on:
  push:
    branches: [main]
    paths:
      - 'FinalProject/**'
      - '.github/workflows/playwright-finalproject.yml'
  pull_request:
    branches: [main]
    paths:
      - 'FinalProject/**'
      - '.github/workflows/playwright-finalproject.yml'
  workflow_dispatch:

env:
  WORKING_DIR: ./FinalProject

jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ env.WORKING_DIR }}

      - name: Check formatting
        run: pnpm run format:check
        working-directory: ${{ env.WORKING_DIR }}

      - name: Lint
        run: pnpm run lint
        working-directory: ${{ env.WORKING_DIR }}

      - name: Type check
        run: pnpm run typecheck
        working-directory: ${{ env.WORKING_DIR }}

  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ env.WORKING_DIR }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps ${{ matrix.project }}
        working-directory: ${{ env.WORKING_DIR }}

      - name: Run Playwright tests
        run: pnpm exec playwright test --project=${{ matrix.project }}
        working-directory: ${{ env.WORKING_DIR }}

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: pnpm run report:allure
        working-directory: ${{ env.WORKING_DIR }}

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-finalproject-${{ matrix.project }}
          path: ${{ env.WORKING_DIR }}/playwright-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test traces/screenshots on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-finalproject-${{ matrix.project }}
          path: ${{ env.WORKING_DIR }}/test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-finalproject-${{ matrix.project }}
          path: ${{ env.WORKING_DIR }}/allure-report
          retention-days: 14
          if-no-files-found: ignore
